# Full stack on one machine: `docker compose up --build` → http://localhost:3000
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      F1_SESSION_CACHE_SIZE: "3"
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./cache:/data/fastf1-cache
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped
