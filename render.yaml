# Alternative to Hugging Face: Render Blueprint for the API (paid plan).
# The frontend deploys to Vercel (see docs/DEPLOY.md).
services:
  - type: web
    name: pitwall-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: standard           # 2 GB RAM: ~180 MB base + ~210 MB per loaded race
    healthCheckPath: /api/v1/health
    envVars:
      - key: F1_CACHE_DIR
        value: /data/fastf1-cache
      - key: F1_SESSION_CACHE_SIZE
        value: "6"
      - key: F1_WARM
        value: latest
    disk:
      name: fastf1-cache
      mountPath: /data/fastf1-cache
      sizeGB: 10
