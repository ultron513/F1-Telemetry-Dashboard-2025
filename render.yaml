# Render Blueprint for the API. The frontend deploys to Vercel (see README).
services:
  - type: web
    name: pitwall-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter            # FastF1 sessions need ~1 GB RAM; the free tier is too small
    healthCheckPath: /api/v1/health
    envVars:
      - key: F1_CACHE_DIR
        value: /data/fastf1-cache
      - key: F1_SESSION_CACHE_SIZE
        value: "2"
      - key: CORS_ORIGINS
        sync: false          # set to your Vercel URL, e.g. https://pitwall.vercel.app
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
    disk:
      name: fastf1-cache
      mountPath: /data/fastf1-cache
      sizeGB: 10
