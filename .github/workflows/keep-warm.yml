name: Keep API warm

# Free Hugging Face Spaces sleep after 48 hours without traffic. Pinging the
# health endpoint twice a day keeps the first visitor from waiting for a cold
# start. Enable it by adding a repository variable SITE_URL (your Vercel URL).

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Ping health
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.SITE_URL }}/api/f1/health" || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          echo "API did not respond with 200" && exit 1
