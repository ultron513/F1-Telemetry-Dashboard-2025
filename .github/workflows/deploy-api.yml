name: Deploy API to Hugging Face

# Pushes backend/ to a Hugging Face Docker Space whenever it changes on main.
# Needs two repository settings (Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  – a Hugging Face access token with "write" permission
#   variable HF_SPACE  – the Space id, e.g. "your-hf-username/pitwall-api"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/huggingface/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble Space contents
        run: |
          mkdir space
          cp -r backend/app backend/main.py backend/requirements.txt backend/Dockerfile backend/.dockerignore space/
          cp deploy/huggingface/README.md space/README.md
          # Spaces get 16 GB of RAM: keep many more sessions in memory.
          sed -i 's/^ENV PYTHONDONTWRITEBYTECODE=1/ENV F1_SESSION_CACHE_SIZE=16 \\\n    PYTHONDONTWRITEBYTECODE=1/' space/Dockerfile
          grep -n "F1_SESSION_CACHE_SIZE" space/Dockerfile

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

      - name: Summary
        run: |
          SLUG=$(echo "${{ vars.HF_SPACE }}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')
          echo "API: https://${SLUG}.hf.space/api/v1/health" >> "$GITHUB_STEP_SUMMARY"
